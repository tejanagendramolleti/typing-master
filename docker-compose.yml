services:
  postgres:
    image: postgres:16-alpine
    container_name: examtyper-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examtyper}
      POSTGRES_USER: ${POSTGRES_USER:-examtyper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examtyper}
      # Deterministic collation so ORDER BY does not change between machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examtyper} -d ${POSTGRES_DB:-examtyper}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examtyper-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-examtyper}
      POSTGRES_USER: ${POSTGRES_USER:-examtyper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examtyper}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-mock}
      MAIL_MODE: ${MAIL_MODE:-console}
      MAIL_FROM: ${MAIL_FROM:-no-reply@examtyper.local}
      AI_ENABLED: ${AI_ENABLED:-false}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@examtyper.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      DEMO_FREE_EMAIL: ${DEMO_FREE_EMAIL:-free@examtyper.local}
      DEMO_FREE_PASSWORD: ${DEMO_FREE_PASSWORD:-Free@12345}
      DEMO_PRO_EMAIL: ${DEMO_PRO_EMAIL:-pro@examtyper.local}
      DEMO_PRO_PASSWORD: ${DEMO_PRO_PASSWORD:-Pro@12345}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examtyper-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
